<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04050c">
<title>Dye Chart Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --void:#04050c; --glass:rgba(140,160,255,.055); --edge:rgba(150,170,255,.16); --edge-2:rgba(150,170,255,.28);
  --ink:#e9ecff; --dim:#9aa3c7; --faint:#646d93; --ice:#7fd8ff; --plasma:#a98bff;
  --raise:#ff5f7e; --bluff:#7d8bff; --call:#2fd4a4; --fold:#3b4263; --foldin:#5b5f78; --warn:#ffc86b;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--void);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(169,139,255,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(127,216,255,.10), transparent 60%),
    var(--void);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:12px}
@media (min-width:900px){ .wrap{grid-template-columns:400px 1fr;align-items:start} header{grid-column:1/-1} }
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:20px;letter-spacing:.08em;margin:0;text-transform:uppercase}
h1 span{color:var(--ice)}
.sub{color:var(--faint);font-size:12px;font-family:var(--mono)}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:12px}
.step{display:grid;gap:7px}
.step + .step{margin-top:12px;padding-top:12px;border-top:1px solid var(--edge)}
.lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--edge);background:transparent;border-radius:20px;padding:6px 12px;font-size:14px;color:var(--dim);min-height:36px}
.chip:disabled{opacity:.28;cursor:default}
.chip[aria-pressed="true"]{border-color:var(--ice);color:var(--ink);background:rgba(127,216,255,.14)}
.seats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.seats .chip{font-family:var(--mono);font-size:12px;padding:6px 0;border-radius:8px;min-height:38px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .chip{border-radius:10px;text-align:left;padding:8px 10px;line-height:1.25}
.acts .chip small{display:block;color:var(--faint);font-size:11px}
.acts .chip[aria-pressed="true"] small{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.toggle input{accent-color:var(--ice);width:18px;height:18px}

.out{display:grid;gap:10px}
.title{font-family:var(--display);font-size:19px;letter-spacing:.03em;line-height:1.2}
.key{font-family:var(--mono);font-size:11px;color:var(--faint)}
.size{border-left:3px solid var(--ice);padding:6px 10px;background:rgba(127,216,255,.06);border-radius:0 8px 8px 0;font-size:14px}
.size b{color:var(--ice)}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:rgba(255,200,107,.06);border-radius:0 8px 8px 0;font-size:13px;color:var(--dim)}
.grid13{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;width:100%;max-width:620px;user-select:none}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:clamp(7px,2.2vw,11px);border-radius:3px;background:var(--fold);color:#8c93b8;border:0;padding:0;letter-spacing:-.03em}
.c.R{background:var(--raise);color:#fff}
.c.B{background:var(--bluff);color:#fff}
.c.G{background:var(--call);color:#03251b}
.c.D{background:var(--foldin);color:#e8e9f3}
.c.X{background:rgba(150,170,255,.03);color:#3c4365}
.c.sel{outline:2px solid #fff;outline-offset:-1px;box-shadow:0 0 12px #fff;position:relative;z-index:1;font-weight:700}
.legend{display:grid;gap:4px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:13px;height:13px;border-radius:3px;flex:none}
.legend .pct{margin-left:auto;font-family:var(--mono);color:var(--faint);font-size:12px}
.pick{min-height:44px;display:flex;align-items:center;gap:10px;font-size:15px;padding:8px 10px;border:1px solid var(--edge);border-radius:10px}
.pick b{font-family:var(--mono);font-size:18px}
.pick .tag{padding:2px 9px;border-radius:12px;font-weight:600;font-size:13px}
.empty{color:var(--faint);font-size:14px}
@media (max-width:560px){
  .seats .chip{font-size:10.5px;letter-spacing:-.04em}
  .acts .chip small{display:none}
  .acts .chip{padding:7px 9px;font-size:13px;min-height:38px}
  .step + .step{margin-top:9px;padding-top:9px}
  .glass{padding:10px}
}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dye <span>Chart Guide</span></h1>
    <div class="sub">$1/$3 · 9-handed · no ante · $300 · <a href="index.html" style="color:var(--ice);text-decoration:none">&#8592; Trainer</a></div>
  </header>

  <section class="glass" aria-label="Spot">
    <div class="step">
      <div class="lbl">1 · My seat</div>
      <div class="chips seats" id="seats"></div>
    </div>
    <div class="step">
      <div class="lbl">2 · Action to me</div>
      <div class="acts" id="acts"></div>
    </div>
    <div class="step" id="detail" hidden>
      <div class="lbl" id="detailLbl">3 · Details</div>
      <div id="detailBody" style="display:grid;gap:10px"></div>
    </div>
    <div class="step">
      <div class="row">
        <label class="toggle"><input type="checkbox" id="live" checked> Live 1/3 reads (bet-size adjustments)</label>
      </div>
    </div>
  </section>

  <section class="glass out" id="out" aria-live="polite"></section>
</div>

const POS = ['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB'];
const RANKS = 'AKQJT98765432';
const HANDS = []; for(let i=0;i<13;i++) for(let j=0;j<13;j++) HANDS.push(i===j?RANKS[i]+RANKS[j]: i<j? RANKS[i]+RANKS[j]+'s' : RANKS[j]+RANKS[i]+'o');
const COMBOS = h => h.length===2?6: h[2]==='s'?4:12;
const COLORS = {R:'var(--raise)',B:'var(--bluff)',G:'var(--call)',F:'var(--fold)',D:'var(--foldin)',X:'rgba(150,170,255,.08)'};
const isBroadway = h => h.length===3 && RANKS.indexOf(h[1])<=4;
const r5 = x => Math.round(x/5)*5;
const blind = p => p==='SB'||p==='BB';

/* state */
let S = {hero:'CO', act:'rfi', villain:null, open:15, limpers:1, callers:1, threebet:40, bbRaise:15, live:true, hand:null};
try{ const s=JSON.parse(localStorage.getItem('dyeguide')||'null'); if(s) S=Object.assign(S,s,{hand:null}); }catch(e){}
function save(){ try{ localStorage.setItem('dyeguide',JSON.stringify(S)); }catch(e){} }

const ACTS = [
  {id:'rfi',     t:'Folded to me',        s:'open or fold'},
  {id:'limp',    t:'Limper(s)',           s:'iso, overlimp, fold'},
  {id:'raise',   t:'Facing a raise',      s:'3-bet, call, fold'},
  {id:'squeeze', t:'Raise + caller(s)',   s:'squeeze, call, fold'},
  {id:'vs3bet',  t:'I opened, got 3-bet', s:'4-bet, call, fold'},
  {id:'vs4bet',  t:'I 3-bet, got 4-bet',  s:'5-bet jam or fold'},
  {id:'sblimp',  t:'I limped SB, BB raised', s:'3-bet, call, fold'}
];
const hi = () => POS.indexOf(S.hero);
function before(){ return POS.slice(0,hi()); }
function after(){ return POS.slice(hi()+1); }
function villainChoices(){
  switch(S.act){
    case 'raise': case 'vs4bet': return before();
    case 'squeeze': return POS.slice(0,Math.max(0,hi()-1));
    case 'vs3bet': return after();
    default: return [];
  }
}
function actOK(id){
  const h=S.hero;
  if(id==='rfi') return h!=='BB';
  if(id==='limp'||id==='raise'||id==='vs4bet') return h!=='UTG';
  if(id==='squeeze') return hi()>=2;
  if(id==='vs3bet') return h!=='BB';
  if(id==='sblimp') return h==='SB';
}
function findKey(prefix, a, b){
  return DATA.keys.find(k=>{ if(!k.startsWith(prefix+':'+a+' vs ')) return false; return k.split(' vs ')[1].split('/').includes(b); });
}
function heroIP(){
  const h=S.hero, v=S.villain;
  if(S.act==='raise'||S.act==='vs4bet') return !blind(h) || (h==='BB'&&v==='SB');
  if(S.act==='squeeze'||S.act==='limp') return !blind(h);
  if(S.act==='vs3bet') return blind(v) && h!=='SB';
  return false;
}
function tier3(){ return S.threebet<=35?'small':S.threebet<=45?'std':'big'; }
const LIVE={
  std:{r:['AA','KK','QQ','AKs','AKo'], call:['JJ','TT','AQs','AJs','KQs'], ipCall:['99','88','AQo','KJs','QJs','JTs','ATs']},
  big:{r:['AA','KK','AKs','AKo'], call:['QQ','JJ','TT','AQs'], ipCall:['AJs','KQs','AQo']}
};
function liveAdjust(g){
  if(!S.live) return [g,null];
  const a=g.split(''), ip=heroIP();
  let note=null;
  if(S.act==='vs3bet'){
    const t=tier3();
    if(t==='small'){ for(let i=0;i<169;i++) if(a[i]==='B') a[i]=isBroadway(HANDS[i])?'G':'D';
      note='Small 3-bet ($35 or less): live players rarely fold to a 4-bet here, so the bluff 4-bets become calls (broadways) or folds.'; }
    else { const L=LIVE[t], r=new Set(L.r), c=new Set(L.call.concat(ip?L.ipCall:[]));
      for(let i=0;i<169;i++){ if(a[i]==='X') continue; const h=HANDS[i]; a[i]=r.has(h)?'R':c.has(h)?'G':'D'; }
      note = t==='std' ? 'Standard live 3-bet ($40–45): usually TT+, AQ+, AJs, KQs with few bluffs. 4-bet only '+L.r.join(', ')+'; call the next tier'+(ip?' (wider in position)':'')+'.'
                       : 'Big live 3-bet ($50+): almost always QQ+ or AK. 4-bet only '+L.r.join(', ')+'; call a narrow range'+(ip?' in position':'')+'.'; }
  } else if(S.act==='raise' && S.open>=20){
    const hasCall=a.includes('G');
    for(let i=0;i<169;i++){ const h=HANDS[i], c=a[i];
      if(c==='B') a[i]=(isBroadway(h)&&hasCall)?'G':'F';
      else if(c==='G' && !(h.length===2 || isBroadway(h) || (h[0]==='A'&&h[2]==='s'))) a[i]='F'; }
    note='Open of $20+: live big opens are strong. Bluff 3-bets drop, and the calling range tightens to pairs, broadways and suited aces.';
  }
  return [a.join(''), note];
}
function legend(key){
  if(key.startsWith('RFI:SB')) return {R:'Raise for value',B:'Raise as a bluff',G:'Limp',F:'Fold'};
  if(key.startsWith('RFI:')) return {R:'Raise',B:'Raise as a bluff',G:'Open-limp',F:'Fold'};
  if(key.startsWith('VS:')) return {R:'3-bet for value',B:'3-bet as a bluff',G:'Call',F:'Fold'};
  if(key.startsWith('SQZ:')) return {R:'Squeeze for value',B:'Squeeze as a bluff',G:'Call',F:'Fold'};
  if(key==='LIMP:BB') return {R:'Raise',B:'Raise as a bluff',G:'Check'};
  if(key==='LIMP:SB') return {R:'Raise',B:'Raise as a bluff',G:'Complete',F:'Fold'};
  if(key.startsWith('LIMP:')) return {R:'Iso-raise',B:'Iso-raise as a bluff',G:'Overlimp',F:'Fold'};
  if(key.startsWith('3B:')) return {R:'4-bet for value',B:'4-bet as a bluff',G:'Call',D:'Fold',F:'Fold',X:'Not in my open'};
  if(key.startsWith('V4B:')) return {R:'5-bet all-in',B:'5-bet all-in as a bluff',G:'Call',F:'Fold'};
  if(key.startsWith('SBL:')) return {R:'3-bet for value',B:'3-bet as a bluff',G:'Call',D:'Fold',F:'Fold',X:'Not limped'};
  return {};
}

/* which chart, what it's called, how big to bet */
function spot(){
  const h=S.hero, v=S.villain, ip=heroIP();
  switch(S.act){
    case 'rfi': return {key:'RFI:'+h, title:`${h} · folded to me`,
      size: h==='SB' ? 'Raise to <b>$12–15</b>. Limp (complete $2) the limp hands.' : 'Open to <b>$12–15</b>. $9 invites the table in; $25+ only gets called by better.'};
    case 'limp': {
      const n=S.limpers, base=15+5*n+(ip?0:5);
      const key='LIMP:'+(['UTG+1','UTG+2','LJ'].includes(h)?'EP':h);
      return {key, title:`${h} · ${n===3?'3+':n} limper${n>1?'s':''}`,
        size: h==='BB' ? `Raise to <b>$${base}</b> or check.` : `Iso-raise to <b>$${base}</b> ($15 + $5 per limper${ip?'':' + $5 out of position'}).`};
    }
    case 'raise': return {key:findKey('VS',h,v), title:`${h} · facing ${v} open to $${S.open}`,
      size:`3-bet to <b>$${r5(S.open*(ip?3:4))}</b> (${ip?'3× in position':'4× out of position'}). Call costs $${S.open-(h==='BB'?3:h==='SB'?1:0)}.`};
    case 'squeeze': {
      const n=S.callers, to=r5(S.open*(ip?3:4)+S.open*n);
      return {key:findKey('SQZ',h,v), title:`${h} · ${v} opens $${S.open}, ${n===3?'3+':n} caller${n>1?'s':''}`,
        size:`Squeeze to <b>$${to}</b> (${ip?'3×':'4×'} the open + 1× per caller). Callers rarely fold, so bluffs mostly become calls or folds.`};
    }
    case 'vs3bet': return {key:findKey('3B',h,v), title:`${h} opened · ${v} 3-bets to $${S.threebet}`,
      size:`4-bet to <b>$${r5(S.threebet*(ip?2.25:2.5))}</b> (${ip?'2.25× in position':'2.5× out of position'}). Never jam $300 over a 3-bet.`};
    case 'vs4bet': return {key:ip?'V4B:IP':'V4B:OOP', title:`${h} 3-bet ${v} · ${v} 4-bets`,
      size:`<b>Jam $300</b> or fold. Live 1/3 4-bets are almost always KK+ or AK.`};
    case 'sblimp': return {key:'SBL:SB vs BB', title:`SB limped · BB raises to $${S.bbRaise}`,
      size:`3-bet to <b>$${r5(S.bbRaise*4)}</b> (4× out of position). Call costs $${S.bbRaise-3}.`};
  }
}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
function chip(label, pressed, on, extra){
  const b=document.createElement('button'); b.className='chip'+(extra||''); b.type='button';
  b.innerHTML=label; b.setAttribute('aria-pressed',pressed?'true':'false'); b.onclick=on; return b;
}
function fix(){
  if(!actOK(S.act)) S.act = ACTS.find(a=>actOK(a.id)).id;
  const vc=villainChoices();
  if(vc.length && !vc.includes(S.villain)) S.villain = S.act==='vs3bet' ? vc[0] : vc[vc.length-1];
  if(S.act==='squeeze'){ const room=hi()-POS.indexOf(S.villain)-1; if(S.callers>room) S.callers=Math.max(1,room); }
}
function render(){
  fix(); save();
  const seats=$('seats'); seats.innerHTML='';
  POS.forEach(p=>seats.appendChild(chip(p, p===S.hero, ()=>{S.hero=p;S.hand=null;render();})));
  const acts=$('acts'); acts.innerHTML='';
  ACTS.forEach(a=>{ const b=chip(`${a.t}<small>${a.s}</small>`, a.id===S.act, ()=>{S.act=a.id;S.hand=null;render();}); b.disabled=!actOK(a.id); acts.appendChild(b); });

  // details
  const D=$('detailBody'); D.innerHTML=''; const rows=[];
  const group=(lbl, items)=>{ const w=document.createElement('div'); w.style.display='grid'; w.style.gap='6px';
    const l=document.createElement('div'); l.className='lbl'; l.textContent=lbl; w.appendChild(l);
    const c=document.createElement('div'); c.className='chips'; items.forEach(x=>c.appendChild(x)); w.appendChild(c); rows.push(w); };
  const vc=villainChoices();
  if(vc.length){
    const lbl={raise:'Who raised',squeeze:'Who opened',vs3bet:'Who 3-bet',vs4bet:'Who I 3-bet (now 4-betting)'}[S.act];
    group(lbl, vc.map(p=>chip(p,p===S.villain,()=>{S.villain=p;render();},' seatc')));
  }
  if(S.act==='raise'||S.act==='squeeze') group('Open size',[10,15,20,25].map(x=>chip('$'+x+(x===25?'+':''),S.open===x,()=>{S.open=x;render();})));
  if(S.act==='squeeze'){ const room=hi()-POS.indexOf(S.villain)-1; group('Callers',[1,2,3].map(n=>{ const b=chip(n===3?'3+':String(n),S.callers===n,()=>{S.callers=n;render();}); b.disabled=n>room; return b; })); }
  if(S.act==='limp') group('Limpers',[1,2,3].map(n=>chip(n===3?'3+':String(n),S.limpers===n,()=>{S.limpers=n;render();})));
  if(S.act==='vs3bet') group('3-bet size',[[30,'≤ $35 small'],[40,'$40–45 standard'],[50,'$50+ big']].map(([x,t])=>chip(t,S.threebet===x,()=>{S.threebet=x;render();})));
  if(S.act==='sblimp') group('BB raise to',[10,15,20].map(x=>chip('$'+x,S.bbRaise===x,()=>{S.bbRaise=x;render();})));
  rows.forEach(r=>D.appendChild(r));
  $('detail').hidden=!rows.length;
  $('live').checked=S.live;
  renderOut();
}
function renderOut(){
  const sp=spot(), O=$('out');
  if(!sp.key || !DATA.charts[sp.key]){ O.innerHTML='<div class="empty">No chart for this spot.</div>'; return; }
  const base=DATA.charts[sp.key], [g,note]=liveAdjust(base), L=legend(sp.key);
  // counts
  const tot={}; let all=0;
  for(let i=0;i<169;i++){ const c=g[i]; if(c==='X') continue; const n=COMBOS(HANDS[i]); tot[c]=(tot[c]||0)+n; all+=n; }
  const order=['R','B','G','F','D','X'].filter(c=>L[c] && (tot[c] || c==='X' && g.includes('X')));
  const seenLabel=new Set();
  const leg=order.filter(c=>{ if(c==='D'&&L.F===L.D&&order.includes('F')) return false; return true; }).map(c=>{
    let n=tot[c]||0; if(c==='F'&&L.D===L.F) n+=tot.D||0;
    if(c==='D'&&L.D===L.F) n+=tot.F||0;
    const pct = c==='X' ? '' : (all? (100*n/all).toFixed(0)+'%':'');
    return `<div><i style="background:${COLORS[c]}"></i>${L[c]}<span class="pct">${pct}</span></div>`;
  }).join('');
  let pick='<div class="pick empty">Tap a hand to see the play.</div>';
  if(S.hand){ const i=HANDS.indexOf(S.hand), c=g[i];
    const fg = c==='G'?'#03251b':'#fff';
    pick=`<div class="pick"><b>${S.hand}</b><span class="tag" style="background:${COLORS[c]};color:${fg}">${L[c]||'Fold'}</span>${base[i]!==c?'<span class="key">chart: '+(L[base[i]]||'Fold')+'</span>':''}</div>`; }
  O.innerHTML = `
    <div><div class="title">${sp.title}</div><div class="key">${sp.key}</div></div>
    <div class="size">${sp.size}</div>
    ${note?`<div class="note">${note}</div>`:''}
    <div class="grid13" id="grid">${HANDS.map((h,i)=>`<button class="c ${g[i]}${h===S.hand?' sel':''}" data-h="${h}" aria-label="${h}: ${L[g[i]]||'Fold'}">${h}</button>`).join('')}</div>
    ${pick}
    <div class="legend">${leg}</div>`;
  $('grid').onclick=e=>{ const b=e.target.closest('.c'); if(!b) return; S.hand = S.hand===b.dataset.h?null:b.dataset.h; renderOut(); };
}
$('live').onchange=e=>{ S.live=e.target.checked; render(); };
render();
</script>
</body>
</html>
